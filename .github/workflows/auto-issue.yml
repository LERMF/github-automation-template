name: Auto Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Label Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const labelsToAdd = ['triage'];

            if (title.includes('bug') || body.includes('bug') || body.includes('error')) {
              labelsToAdd.push('bug');
            } else if (title.includes('feat') || body.includes('feature')) {
              labelsToAdd.push('enhancement');
            } else if (title.includes('doc') || body.includes('documentation')) {
              labelsToAdd.push('documentation');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: labelsToAdd
            });
