name: Auto Create Issues from TODOs
on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  create-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Find TODOs and create issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODO_PATTERN="(TODO|FIXME|HACK|BUG):"
          grep -rn "$TODO_PATTERN" . --exclude-dir={node_modules,.git,dist,build} --include="*.js" --include="*.ts" --include="*.py" > todos.txt || true

          if [ -s todos.txt ]; then
            while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              CONTENT=$(echo "$line" | cut -d: -f3-)
              TYPE=$(echo "$CONTENT" | grep -oE "(TODO|FIXME|HACK|BUG)" | head -1)

              case "$TYPE" in
                "BUG"|"FIXME") LABEL="bug" ;;
                "TODO") LABEL="enhancement" ;;
                *) LABEL="documentation" ;;
              esac

              TITLE="[$TYPE] $(echo "$CONTENT" | sed 's/.*: //' | cut -c1-60)"
              gh issue create --title "$TITLE" --body "From: $FILE" --label "$LABEL,auto-generated" --repo ${{ github.repository }} || true
            done < todos.txt
          fi
