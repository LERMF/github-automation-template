name: Auto Merge PR
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (github.event_name == 'pull_request' || 
       github.event_name == 'pull_request_review' || 
       github.event_name == 'check_suite')

    steps:
      - name: Check PR labels
        id: check-labels
        run: |
          if echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | grep -q 'auto-merge'; then
            echo "auto_merge=true" >> $GITHUB_OUTPUT
          else
            echo "auto_merge=false" >> $GITHUB_OUTPUT
          fi

      - name: Check PR approvals
        if: steps.check-labels.outputs.auto_merge == 'true'
        id: check-approvals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPROVALS=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --jq '[.[] | select(.state=="APPROVED")] | length')
          echo "approvals=$APPROVALS" >> $GITHUB_OUTPUT
          if [ "$APPROVALS" -ge 1 ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "approved=false" >> $GITHUB_OUTPUT
          fi

      - name: Enable auto-merge
        if: steps.check-labels.outputs.auto_merge == 'true' && steps.check-approvals.outputs.approved == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}

      - name: Comment on PR
        if: steps.check-labels.outputs.auto_merge == 'true' && steps.check-approvals.outputs.approved == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🤖 Auto-merge enabled! Will merge when all checks pass." --repo ${{ github.repository }}
